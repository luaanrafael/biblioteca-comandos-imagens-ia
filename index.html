<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo Visual de Prompts IA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131c2e;
      --card-border: #1e293b;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --primary: #6366f1;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px 16px;
      line-height: 1.5;
    }

    header {
      max-width: 1300px;
      margin: 0 auto 30px auto;
    }
    .hero {
      text-align: center;
      margin-bottom: 24px;
    }
    .hero h1 {
      font-size: 2.2rem;
      font-weight: 800;
      color: #fff;
      letter-spacing: -0.5px;
    }
    .hero p {
      color: var(--muted);
      margin-top: 6px;
      font-size: 1rem;
    }

    .search-bar {
      max-width: 800px;
      margin: 0 auto 20px auto;
      position: relative;
    }
    .search-input {
      width: 100%;
      padding: 16px 20px 16px 48px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      color: #fff;
      font-size: 1.05rem;
      outline: none;
      transition: all 0.2s;
    }
    .search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }
    .search-icon {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.2rem;
      color: var(--muted);
    }

    .filters {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 24px;
    }
    .chip {
      background: #1e293b;
      border: 1px solid #334155;
      color: var(--muted);
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .chip:hover, .chip.active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 22px;
      max-width: 1300px;
      margin: 0 auto;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: var(--accent);
    }

    .card-preview {
      width: 100%;
      height: 190px;
      position: relative;
      background: #060911;
      overflow: hidden;
    }
    .card-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }
    .card:hover .card-preview img {
      transform: scale(1.05);
    }
    .badge {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(4px);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .card-body {
      padding: 18px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
      gap: 12px;
    }
    .command-tag {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.1);
      padding: 4px 10px;
      border-radius: 8px;
      width: fit-content;
    }
    .card-desc {
      font-size: 0.88rem;
      color: #cbd5e1;
    }

    .prompt-box {
      background: #0b1120;
      border: 1px solid #1e293b;
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.8rem;
    }
    .prompt-label {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .prompt-code {
      font-family: 'JetBrains Mono', monospace;
      color: #e2e8f0;
      word-break: break-word;
    }

    .tip-box {
      font-size: 0.78rem;
      color: #7dd3fc;
      background: rgba(14, 165, 233, 0.08);
      border-left: 3px solid #0284c7;
      padding: 8px 10px;
      border-radius: 0 8px 8px 0;
    }

    .card-actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
      padding-top: 8px;
    }
    .btn {
      flex: 1;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.82rem;
      cursor: pointer;
      border: none;
      transition: all 0.2s;
    }
    .btn-outline { background: #1e293b; color: #fff; }
    .btn-outline:hover { background: #334155; }
    .btn-solid { background: var(--primary); color: #fff; }
    .btn-solid:hover { background: #4f46e5; }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--success);
      color: #fff;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.88rem;
      box-shadow: 0 10px 20px rgba(0,0,0,0.4);
      display: none;
      z-index: 1000;
    }
  </style>
</head>
<body>

  <header>
    <div class="hero">
      <h1>📸 Galeria de Prompts IA</h1>
      <p id="counter">Carregando catálogo...</p>
    </div>

    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" class="search-input" placeholder="Pesquisar por comando (/85mmlook), estilo, iluminação ou lente...">
    </div>

    <div class="filters">
      <button class="chip active" onclick="filtrar('TODOS', this)">Todos</button>
      <button class="chip" onclick="filtrar('Fotografia', this)">📷 Fotografia (160)</button>
      <button class="chip" onclick="filtrar('Estilos', this)">🎨 Atalhos de Estilo (99)</button>
    </div>
  </header>

  <main class="grid" id="grid"></main>

  <div id="toast" class="toast">Copiado para a área de transferência!</div>

  <!-- Carrega a base gerada da planilha -->
  <script src="dados.js"></script>
  <script>
    let filtroColecao = 'TODOS';

    function init() {
      if (typeof BANCO_COMANDOS === 'undefined') {
        document.getElementById('grid').innerHTML = '<p style="text-align:center;grid-column:1/-1;">Arquivo dados.js não encontrado.</p>';
        return;
      }
      document.getElementById('counter').innerText = `${BANCO_COMANDOS.length} comandos com pré-visualização IA`;
      render();
    }

    function render() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const grid = document.getElementById('grid');

      const items = BANCO_COMANDOS.filter(c => {
        const matchesCol = (filtroColecao === 'TODOS') || (c.colecao === filtroColecao);
        const matchesQuery = !q ||
          c.comando.toLowerCase().includes(q) ||
          c.categoria.toLowerCase().includes(q) ||
          c.descricao.toLowerCase().includes(q) ||
          c.exemplo.toLowerCase().includes(q);
        return matchesCol && matchesQuery;
      });

      if (items.length === 0) {
        grid.innerHTML = '<p style="text-align:center;grid-column:1/-1;padding:40px;color:var(--muted)">Nenhum resultado encontrado.</p>';
        return;
      }

      grid.innerHTML = items.map(item => {
        const promptResumido = encodeURIComponent((item.exemplo || item.descricao).slice(0, 110));
        const previewUrl = `https://image.pollinations.ai/prompt/${promptResumido}?width=420&height=220&nologo=true&seed=${item.id}`;

        return `
          <div class="card">
            <div class="card-preview">
              <span class="badge">${item.categoria} #${item.id}</span>
              <img src="${previewUrl}" alt="${item.comando}" loading="lazy" onerror="this.onerror=null; this.src='https://picsum.photos/seed/${item.id}/420/220';">
            </div>
            <div class="card-body">
              <span class="command-tag">${item.comando}</span>
              <p class="card-desc">${item.descricao}</p>
              
              <div class="prompt-box">
                <div class="prompt-label">Prompt de Exemplo:</div>
                <div class="prompt-code">${item.exemplo}</div>
              </div>

              ${item.dica ? `<div class="tip-box">💡 <b>Dica:</b> ${item.dica}</div>` : ''}

              <div class="card-actions">
                <button class="btn btn-outline" onclick="copiar('${item.comando}', 'Comando copiado!')">Copiar /tag</button>
                <button class="btn btn-solid" onclick="copiar('${item.exemplo.replace(/'/g, "\\'")}', 'Prompt completo copiado!')">Copiar Prompt</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function filtrar(tipo, btn) {
      filtroColecao = tipo;
      document.querySelectorAll('.filters .chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    document.getElementById('searchInput').addEventListener('input', render);

    function copiar(txt, msg) {
      navigator.clipboard.writeText(txt).then(() => {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.style.display = 'block';
        setTimeout(() => { t.style.display = 'none'; }, 2000);
      });
    }

    window.onload = init;
  </script>
</body>
</html>
